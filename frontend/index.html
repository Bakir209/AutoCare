<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-layout="app">
  <a class="visually-hidden-focusable" href="#app">Skip to content</a>

  <div class="ac-shell">
    <aside class="ac-sidebar offcanvas-lg offcanvas-start" id="sidebar" tabindex="-1" aria-label="Main navigation">
      <div class="ac-sidebar-head">
        <a href="#/dashboard" class="ac-brand">Auto<span>Care</span></a>
        <button type="button" class="btn-close btn-close-white d-lg-none" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close menu"></button>
      </div>

      <nav class="ac-nav">
        <a href="#/dashboard" data-nav="/dashboard"><i class="bi bi-speedometer2"></i>Dashboard</a>
        <a href="#/vehicles" data-nav="/vehicles"><i class="bi bi-car-front"></i>My vehicles</a>
        <a href="#/services" data-nav="/services"><i class="bi bi-wrench-adjustable"></i>Services</a>
        <a href="#/fuel" data-nav="/fuel"><i class="bi bi-fuel-pump"></i>Fuel logs</a>
        <a href="#/reminders" data-nav="/reminders"><i class="bi bi-bell"></i>Reminders</a>

        <p class="ac-nav-group" data-role="admin">Administration</p>
        <a href="#/admin/users" data-nav="/admin/users" data-role="admin"><i class="bi bi-people"></i>Users</a>
        <a href="#/admin/service-types" data-nav="/admin/service-types" data-role="admin"><i class="bi bi-tools"></i>Service types</a>
      </nav>

      <div class="ac-sidebar-foot">
        <a href="#/profile" data-nav="/profile" class="ac-user">
          <span class="ac-avatar">BK</span>
          <span><strong>Bakir</strong><small>Admin</small></span>
        </a>
        <a href="#/login" class="ac-logout" aria-label="Log out"><i class="bi bi-box-arrow-right"></i></a>
      </div>
    </aside>

    <div class="ac-main">
      <header class="ac-topbar d-lg-none">
        <button class="btn btn-link text-white p-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Open menu">
          <i class="bi bi-list fs-2"></i>
        </button>
        <a href="#/dashboard" class="ac-brand">Auto<span>Care</span></a>
      </header>
      <main id="app" class="ac-content" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
