<section class="ac-auth">
  <div class="ac-auth-art">
    <a href="#/login" class="ac-brand">Auto<span>Care</span></a>
    <div>
      <h2>Know what your car needs before it tells you.</h2>
      <p>Services, repairs, fuel and reminders for every vehicle in your garage.</p>
    </div>
  </div>
  <div class="ac-auth-form">
    <div class="inner">
      <h1 class="h2 mb-1">Log in</h1>
      <p class="text-secondary mb-4">Welcome back. Pick up where you left off.</p>
      <form class="js-demo-form needs-validation" data-goto="#/dashboard" novalidate>
        <div class="mb-3">
          <label for="loginEmail" class="form-label">Email</label>
          <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" required>
          <div class="invalid-feedback">Enter a valid email address.</div>
        </div>
        <div class="mb-4">
          <label for="loginPassword" class="form-label">Password</label>
          <input type="password" class="form-control" id="loginPassword" minlength="8" required>
          <div class="invalid-feedback">Password must be at least 8 characters.</div>
        </div>
        <button class="btn btn-primary w-100 py-2" type="submit">Log in</button>
      </form>
      <p class="mt-4 mb-0">New to AutoCare? <a href="#/register">Create an account</a></p>
    </div>
  </div>
</section>
