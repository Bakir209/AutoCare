<div class="ac-page-head">
  <div><h1>Users</h1><p>Manage accounts and roles. Admins only.</p></div>
</div>

<div class="ac-card">
  <div class="table-responsive">
    <table class="table table-hover ac-table">
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Vehicles</th><th>Joined</th><th class="text-end">Actions</th></tr></thead>
      <tbody>
        <tr><td>Bakir</td><td>bakir@example.com</td><td><span class="ac-status done">Admin</span></td><td>3</td><td>01.09.2026</td>
          <td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-dark" data-bs-toggle="modal" data-bs-target="#userModal" aria-label="Edit"><i class="bi bi-pencil"></i></button></td></tr>
        <tr><td>Amra Hodžić</td><td>amra@example.com</td><td><span class="ac-status pending">User</span></td><td>1</td><td>12.09.2026</td>
          <td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-dark" data-bs-toggle="modal" data-bs-target="#userModal" aria-label="Edit"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-outline-danger" aria-label="Delete"><i class="bi bi-trash"></i></button></td></tr>
        <tr><td>Tarik Mehić</td><td>tarik@example.com</td><td><span class="ac-status pending">User</span></td><td>2</td><td>30.09.2026</td>
          <td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-dark" data-bs-toggle="modal" data-bs-target="#userModal" aria-label="Edit"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-outline-danger" aria-label="Delete"><i class="bi bi-trash"></i></button></td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content js-demo-form" novalidate>
      <div class="modal-header"><h2 class="modal-title h4" id="userModalTitle">Edit user</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body">
        <div class="mb-3"><label for="uName" class="form-label">Full name</label><input type="text" class="form-control" id="uName" required></div>
        <div class="mb-3"><label for="uEmail" class="form-label">Email</label><input type="email" class="form-control" id="uEmail" required></div>
        <div><label for="uRole" class="form-label">Role</label><select class="form-select" id="uRole" required><option>User</option><option>Admin</option></select></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save user</button></div>
    </form>
  </div>
</div>
