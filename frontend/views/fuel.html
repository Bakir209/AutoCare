<div class="ac-page-head">
  <div><h1>Fuel logs</h1><p>Spending and consumption over the last six months.</p></div>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#fuelModal"><i class="bi bi-plus-lg me-1"></i>Log fuel</button>
</div>

<div class="ac-card mb-4">
  <div class="ac-card-head"><h2>Cost and consumption</h2></div>
  <div class="ac-card-body"><div style="height: 320px"><canvas id="fuelChart" role="img" aria-label="Monthly fuel cost as bars and consumption in litres per 100 kilometres as a line"></canvas></div></div>
</div>

<div class="ac-card">
  <div class="table-responsive">
    <table class="table table-hover ac-table">
      <thead><tr><th>Date</th><th>Vehicle</th><th>Litres</th><th>Price per litre</th><th>Mileage</th><th class="text-end">Total</th><th class="text-end">Actions</th></tr></thead>
      <tbody>
        <tr><td>22.10.2026</td><td>BMW M340i</td><td>42.1 L</td><td>1.90 KM</td><td>48,320 km</td><td class="text-end">79.90 KM</td>
          <td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-dark" data-bs-toggle="modal" data-bs-target="#fuelModal" aria-label="Edit"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-outline-danger" aria-label="Delete"><i class="bi bi-trash"></i></button></td></tr>
        <tr><td>14.10.2026</td><td>Mazda MX-5</td><td>31.6 L</td><td>1.97 KM</td><td>62,900 km</td><td class="text-end">62.10 KM</td>
          <td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-dark" data-bs-toggle="modal" data-bs-target="#fuelModal" aria-label="Edit"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-outline-danger" aria-label="Delete"><i class="bi bi-trash"></i></button></td></tr>
        <tr><td>09.10.2026</td><td>BMW M340i</td><td>38.7 L</td><td>1.89 KM</td><td>47,610 km</td><td class="text-end">73.14 KM</td>
          <td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-dark" data-bs-toggle="modal" data-bs-target="#fuelModal" aria-label="Edit"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-outline-danger" aria-label="Delete"><i class="bi bi-trash"></i></button></td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="fuelModal" tabindex="-1" aria-labelledby="fuelModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content js-demo-form" novalidate>
      <div class="modal-header"><h2 class="modal-title h4" id="fuelModalTitle">Fuel log</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-12"><label for="flVehicle" class="form-label">Vehicle</label><select class="form-select" id="flVehicle" required><option value="" selected disabled>Choose</option><option>BMW M340i</option><option>Mazda MX-5</option><option>Škoda Octavia</option></select></div>
          <div class="col-6"><label for="flDate" class="form-label">Date</label><input type="date" class="form-control" id="flDate" required></div>
          <div class="col-6"><label for="flKm" class="form-label">Mileage (km)</label><input type="number" class="form-control" id="flKm" min="0" required></div>
          <div class="col-6"><label for="flL" class="form-label">Litres</label><input type="number" class="form-control" id="flL" min="0" step="0.01" required></div>
          <div class="col-6"><label for="flP" class="form-label">Price per litre (KM)</label><input type="number" class="form-control" id="flP" min="0" step="0.01" required></div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save fuel log</button></div>
    </form>
  </div>
</div>
